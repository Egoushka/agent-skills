name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the catalog reads git history

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - run: pip install -r requirements-dev.txt

      - name: Skills follow the spec and the authoring rules
        run: python tools/validate.py --strict

      - name: Vendored skills are byte-identical to their pinned upstream
        run: python tools/vendor.py verify

      - name: README catalog is current
        run: python tools/catalog.py --check

      - name: Unit tests
        run: python -m unittest discover -s tests -v

      - name: Workflows lint clean
        run: docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.12 -color
