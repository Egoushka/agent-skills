name: refs-image

# Builds the refs MCP server image, smoke-tests it against the real corpora,
# then publishes ghcr.io/egoushka/agent-skills-refs for amd64 and arm64.

on:
  push:
    branches: [main]
    paths:
      - refs/**
      - skills/dev-references/scripts/**
      - skills/dev-references/assets/**
      - .github/workflows/refs-image.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/egoushka/agent-skills-refs

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build for the smoke test
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: refs/Dockerfile
          load: true
          tags: refs:smoke
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test (first start clones the corpora and builds the index)
        run: |
          docker run -d --name refs -p 8765:8765 -e REFS_TOKEN=ci-token refs:smoke
          for _ in $(seq 1 60); do
            curl -fsS localhost:8765/healthz | grep -q '"ready":true' && break
            sleep 3
          done
          curl -fsS localhost:8765/healthz
          curl -fsS -X POST localhost:8765/mcp \
            -H 'Authorization: Bearer ci-token' \
            -H 'Content-Type: application/json' \
            -H 'Accept: application/json, text/event-stream' \
            -d '{"jsonrpc":"2.0","id":1,"method":"tools/call","params":{"name":"search_refs","arguments":{"query":"consistent hashing","limit":2}}}' \
            | tee /tmp/answer.json
          grep -q '"hits"' /tmp/answer.json
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST localhost:8765/mcp -d '{}')" = 401
          docker logs refs | tail -20

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short

      - name: Publish
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: refs/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
